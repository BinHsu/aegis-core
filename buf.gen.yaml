# buf codegen config — see ADR-0013 for rationale.
#
# Run via `./tools/scripts/proto_gen.sh` (which shells out to
# `./tools/buf/buf generate`). Outputs go to:
#
#   gateway_go/gen/go/<proto-package-path>/*.pb.go              (Go backend)
#   frontend_web/src/gen/proto/<proto-package-path>/*_pb.ts      (TS frontend)
#
# Both trees are CHECKED IN per ADR-0013 so IDE tooling (gopls, tsc)
# works without a Bazel / buf invocation. Bazel remains the
# authoritative producer for Go (via //proto/aegis/v1:aegis_go_proto);
# CI runs proto_gen.sh + `git diff --exit-code` to catch drift.
#
# Remote plugins (buf.build/...) run server-side on the Buf Schema
# Registry; no local protoc-gen-* install required. Pinned versions
# MUST be bumped deliberately, with a re-run of proto_gen.sh and a
# review of the generated diff.

version: v2

plugins:
  # Go message types.
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: gateway_go/gen/go
    opt:
      - paths=source_relative

  # Go gRPC service stubs (the modern "v2" generator aligned with
  # rules_go's go_grpc_v2 compiler used in //proto/aegis/v1:aegis_go_proto).
  - remote: buf.build/grpc/go:v1.5.1
    out: gateway_go/gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # TypeScript types for the frontend, emitted by protobuf-es v2.
  #
  # This is the ONLY TypeScript plugin the frontend needs. In
  # protobuf-es v2 the generated `*_pb.ts` file carries three kinds of
  # export: a `Message`-branded plain type per message, a `GenMessage`
  # schema constant per message (`FooSchema`), and a `GenService`
  # descriptor constant per service (`Gateway`, `Engine`). Connect-ES
  # v2 consumes that service descriptor directly via
  # `createClient(Gateway, transport)`.
  #
  # There is no `buf.build/connectrpc/es` entry any more. Connect-ES
  # v2 dropped `protoc-gen-connect-es` (npm stops at 1.7.0) precisely
  # because the descriptor it used to emit into `*_connect.ts` now
  # comes from protobuf-es itself. Re-adding that plugin would emit a
  # second, redundant descriptor.
  #
  # Version pinning: the runtime `@bufbuild/protobuf` version in
  # frontend_web/package.json must be >= this plugin version — the
  # generated code imports `@bufbuild/protobuf/codegenv2`, whose
  # surface grows across minor releases. Bump both together and re-run
  # proto_gen.sh.
  #
  # `import_extension` is set explicitly. The v2 default changed to
  # `none`, which emits extensionless relative imports between
  # generated files. Those resolve under `moduleResolution: bundler`
  # (what frontend_web/tsconfig.json uses today) but break under
  # Node's native ESM resolver and under `node16`/`nodenext`. Today
  # aegis.proto is the only proto file so the option changes nothing
  # but the header comment; keeping `.js` means adding a second proto
  # file does not silently emit unresolvable imports.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: frontend_web/src/gen/proto
    opt:
      - target=ts
      - import_extension=.js
